<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f7fb;font-family:Arial}
.top{background:#1e3a8a;color:#fff;padding:15px;text-align:center;border-radius:0 0 20px 20px}
.estoque{display:flex;gap:8px;margin:12px}.est{flex:1;background:#fff;border-radius:15px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.est.cheio{border-left:5px solid #16a34a}.est.vazio{border-left:5px solid #ef4444}.est.vend{border-left:5px solid #facc15}
.est p{font-size:22px;font-weight:bold}
.card{background:#fff;margin:12px;border-radius:15px;padding:10px}
table{width:100%;border-spacing:3px}th{padding:8px 2px;border-radius:8px;color:#fff;font-size:9px}
td input{width:100%;height:38px;border:1px solid #ddd;border-radius:8px;text-align:center}
.calc{height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold;font-size:9px;background:#eef2ff}
.c1{background:#facc15;color:#000}.c2{background:#16a34a}.c3{background:#000}.c4{background:#facc15;color:#000}.c5{background:#ef4444}.c6{background:#0f766e}
.footer{background:#0f766e;margin:12px;border-radius:12px;padding:12px;color:#fff;display:flex;justify-content:space-between;font-weight:bold}
.btn{background:#16a34a;border:none;color:#fff;padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<div class="top">
<h1>🔥 EL SHADAY CONTROLE DE VENDAS</h1>
<div style="background:#fff;color:#000;padding:8px;border-radius:10px;margin-top:8px">📅 <input type="date" id="data"> - ESTOQUE INICIAL: 200 CHEIOS</div>
</div>
<div class="estoque">
<div class="est cheio"><small>🔵 CHEIO RESTANTE</small><p id="qCheio">200</p></div>
<div class="est vazio"><small>🔴 VAZIO</small><p id="qVazio">0</p></div>
<div class="est vend"><small>📦 VENDIDO</small><p id="qVend">0</p></div>
</div>
<div class="card"><table><thead><tr><th class="c1">Cliente</th><th class="c2">Quant</th><th class="c3">Unit</th><th class="c4">Total</th><th class="c5">Desp</th><th class="c6">Resumo</th></tr></thead><tbody id="corpo"></tbody></table></div>
<div class="footer"><span id="tot">TOTAL: 0 • R$ 0,00</span><button class="btn" onclick="novaLinha()">+ Venda</button></div>

<script>
// JA CONFIGURADO PRA VOCÊ - NÃO PRECISA MEXER
const firebaseConfig = { databaseURL: "https://elshaday-controle-2026-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref('vendas');

const ESTOQUE_INICIAL = 200;

function novaLinha(d=null){
let tr=document.createElement('tr');
tr.innerHTML=`<td><input value="${d?d.n:''}" placeholder="Nome"></td>
<td><input type="number" value="${d?d.q:''}" class="q" placeholder="0"></td>
<td><input type="number" value="${d?d.vu:''}" class="vu" placeholder="0"></td>
<td><div class="calc vt">R$ 0</div></td>
<td><input type="number" value="${d?d.de:''}" class="de" placeholder="0"></td>
<td><div class="calc rt">R$ 0</div></td>`;
document.getElementById('corpo').appendChild(tr);
tr.querySelectorAll('input').forEach(inp=>inp.addEventListener('input', ()=>{ calcular(); salvar(); }));
}

function calcular(){
let vend=0, dinheiro=0;
document.querySelectorAll('#corpo tr').forEach(r=>{
let q=parseFloat(r.querySelector('.q')?.value)||0;
let vu=parseFloat(r.querySelector('.vu')?.value)||0;
let de=parseFloat(r.querySelector('.de')?.value)||0;
let vt=q*vu; let rt=vt-de;
r.querySelector('.vt').innerText='R$ '+vt.toFixed(0);
r.querySelector('.rt').innerText='R$ '+rt.toFixed(0);
vend+=q; dinheiro+=rt;
});
let cheio = ESTOQUE_INICIAL - vend; if(cheio<0) cheio=0;
document.getElementById('qCheio').innerText=cheio;
document.getElementById('qVazio').innerText=vend;
document.getElementById('qVend').innerText=vend;
document.getElementById('tot').innerText=`TOTAL: ${vend} botijões • R$ ${dinheiro.toFixed(2).replace('.',',')}`;
}

function salvar(){
let arr=[];
document.querySelectorAll('#corpo tr').forEach(r=>{
arr.push({n:r.querySelectorAll('input')[0].value, q:r.querySelector('.q').value, vu:r.querySelector('.vu').value, de:r.querySelector('.de').value});
});
ref.set(arr);
localStorage.setItem('backup_elshaday', JSON.stringify(arr));
}

ref.on('value', snap=>{
let dados=snap.val();
if(dados && dados.length>0 && document.activeElement.tagName!=='INPUT'){
document.getElementById('corpo').innerHTML='';
dados.forEach(d=>novaLinha(d));
calcular();
}
});

let backup = JSON.parse(localStorage.getItem('backup_elshaday')||'[]');
if(backup.length>0){ backup.forEach(d=>novaLinha(d)); } else { for(let i=0;i<8;i++) novaLinha(); }
calcular();
document.getElementById('data').valueAsDate=new Date();
</script>
</body>
</html>
