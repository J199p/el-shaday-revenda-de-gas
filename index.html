<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY CONTROLE DE VENDAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f7fb;font-family:Arial,sans-serif}
.top{background:#1e3a8a;color:#fff;padding:20px;border-radius:0 0 20px 20px;text-align:center}
.top h1{font-size:20px}
.card{background:#fff;margin:15px;border-radius:20px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
table{width:100%;border-collapse:separate;border-spacing:4px}
th{padding:12px 4px;border-radius:10px;color:#fff;font-size:10px;text-align:center}
td{padding:0}
td input{width:100%;height:48px;border:1px solid #ddd;border-radius:10px;text-align:center;background:#fafafa}
.calc{background:#eef2ff;height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:bold;font-size:11px}
.c-data{background:#2563eb}.c-cli{background:#facc15;color:#000}.c-qtd{background:#16a34a}.c-unit{background:#000}.c-total{background:#facc15;color:#000}.c-desp{background:#ef4444}.c-res{background:#0f766e}
.footer{background:#0f766e;margin:15px;border-radius:15px;padding:15px;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.btn{background:#16a34a;border:none;color:#fff;padding:12px 18px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<div class="top"><h1>🔥 EL SHADAY<br>CONTROLE DE VENDAS</h1></div>
<div class="card">
<table>
<thead><tr>
<th class="c-data">Data<br>📅</th><th class="c-cli">Cliente<br>👤</th><th class="c-qtd">Quant<br>Vendida</th><th class="c-unit">Valor<br>Unitário</th><th class="c-total">Valor<br>Total</th><th class="c-desp">despesa</th><th class="c-res">Resumo<br>Total</th>
</tr></thead>
<tbody id="corpo"></tbody>
</table>
</div>
<div class="footer"><span id="total">TOTAL GERAL: 0 vendas • R$ 0,00</span><button class="btn" onclick="nova()">+ Nova Venda</button></div>
<script>
function nova(){
let tr=document.createElement('tr');
tr.innerHTML=`<td><input type="date"></td><td><input placeholder="Nome"></td><td><input type="number" class="q" oninput="calc()" placeholder="0"></td><td><input type="number" class="vu" oninput="calc()" placeholder="0"></td><td><div class="calc vt">R$ 0,00</div></td><td><input type="number" class="d" oninput="calc()" placeholder="0"></td><td><div class="calc rt">R$ 0,00</div></td>`;
document.getElementById('corpo').appendChild(tr);
}
function calc(){
let tv=0,tt=0;
document.querySelectorAll('#corpo tr').forEach(r=>{
let q=parseFloat(r.querySelector('.q')?.value)||0;
let vu=parseFloat(r.querySelector('.vu')?.value)||0;
let d=parseFloat(r.querySelector('.d')?.value)||0;
let vt=q*vu; let rt=vt-d;
r.querySelector('.vt').innerText='R$ '+vt.toFixed(2).replace('.',',');
r.querySelector('.rt').innerText='R$ '+rt.toFixed(2).replace('.',',');
if(q>0){tv+=q;tt+=rt;}
});
document.getElementById('total').innerText=`TOTAL GERAL: ${tv} vendas • R$ ${tt.toFixed(2).replace('.',',')}`;
}
for(let i=0;i<10;i++) nova();
</script>
</body>
</html>
