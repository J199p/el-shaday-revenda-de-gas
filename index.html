<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Shaday - Revenda</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2">
<div class="max-w-[500px] mx-auto">

<!-- ESTOQUE AUTOMÁTICO - 100% AUTO -->
<div class="bg-black text-white p-3 rounded-xl mb-3 flex justify-between">
  <div>CHEIO: <span id="cheioTxt" class="text-green-400 font-bold text-xl">200</span>
  <button onclick="editarEstoque()" class="text-[10px] bg-zinc-700 px-2 py-1 rounded">EDITAR</button></div>
  <div class="text-xs">VAZIO: <span id="vazioTxt">0</span> | VENDIDO: <span id="vendidoTxt">0</span>
  <button onclick="voltarAuto()" class="bg-green-600 px-2 py-1 rounded ml-2">AUTO</button></div>
</div>

<div id="lista"></div>

<div class="bg-white border-2 border-blue-800 rounded-xl p-3 mt-3 text-sm font-bold">
  <div id="totalGeral"></div>
  <div class="bg-yellow-400 p-2 rounded-lg mt-2">⏰ PRA RECEBER AMANHÃ: R$ <span id="praReceber">0</span></div>
  <div class="bg-red-500 text-white p-2 rounded-lg mt-2">📝 FIADO TOTAL: R$ <span id="fiadoTotal">0</span></div>
</div>

<div class="grid grid-cols-3 gap-2 mt-3">
  <button onclick="fotoZap()" class="bg-yellow-400 p-3 rounded-xl font-bold">FOTO Zap</button>
  <button onclick="novaVenda()" class="bg-green-600 text-white p-3 rounded-xl font-bold">+ Venda</button>
  <button onclick="zerarDia()" class="bg-red-600 text-white p-3 rounded-xl font-bold">ZERAR DIA</button>
</div>
</div>

<script>
let dados = JSON.parse(localStorage.getItem('elshaday_v2')) || [
  {nome:'Neto', qtd:33, valor:82, pago:0, fiado:0},
  {nome:'Rebeca', qtd:11, valor:84, pago:924, fiado:0},
  {nome:'GiL', qtd:21, valor:84, pago:764, fiado:1000},
  {nome:'Melk', qtd:70, valor:82, pago:5740, fiado:0},
  {nome:'Sérgio', qtd:52, valor:85, pago:0, fiado:4420},
  {nome:'Severino', qtd:52, valor:83, pago:4316, fiado:0},
];
let estoqueInicial = parseInt(localStorage.getItem('estoque_inicial')) || 263;
let modoAuto = localStorage.getItem('modo_auto')!== 'false';

function render() {
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  let totalBot=0, totalFixo=0, totalPix=0, totalDH=0, totalFiado=0;
  dados.forEach((d,i)=>{
    let total = d.qtd * d.valor;
    totalBot+=d.qtd; totalFixo+=total; totalFiado+=d.fiado;
    if(d.nome=='GiL' || d.nome=='Sérgio') totalDH+=d.pago; else totalPix+=d.pago;
    lista.innerHTML+=`<div class="bg-white rounded-xl p-2 mb-1 grid grid-cols-7 gap-1 items-center">
      <input class="border rounded p-1 font-bold" value="${d.nome}" onchange="dados[${i}].nome=this.value; salvar()">
      <input class="border rounded p-1 text-center" type="number" value="${d.qtd}" onchange="dados[${i}].qtd=parseInt(this.value)||0; salvar()">
      <input class="border rounded p-1 text-center" type="number" value="${d.valor}" onchange="dados[${i}].valor=parseInt(this.value)||0; salvar()">
      <div class="text-[11px]">R$ ${total}</div>
      <input class="border rounded p-1 text-center" type="number" value="${d.pago}" onchange="dados[${i}].pago=parseInt(this.value)||0; salvar()">
      <div class="text-[11px]">R$ ${total-d.pago}</div>
      <div>✅</div></div>`;
  });
  let cheioAtual = modoAuto? estoqueInicial - totalBot : estoqueInicial;
  document.getElementById('cheioTxt').innerText=cheioAtual;
  document.getElementById('vazioTxt').innerText=totalBot;
  document.getElementById('vendidoTxt').innerText=totalBot;
  document.getElementById('totalGeral').innerText=`TOTAL: ${totalBot} bot | FIXO R$ ${totalFixo} | PIX R$ ${totalPix} | DH R$ ${totalDH} | CHEIO ${cheioAtual}`;
  document.getElementById('praReceber').innerText= totalFiado>0?totalFiado:(totalFixo-totalPix-totalDH);
  document.getElementById('fiadoTotal').innerText=totalFiado;
}
function salvar(){localStorage.setItem('elshaday_v2',JSON.stringify(dados)); render();}
function editarEstoque(){let n=prompt('Quantos CHEIOS agora?',estoqueInicial); if(n){estoqueInicial=parseInt(n); localStorage.setItem('estoque_inicial',estoqueInicial); modoAuto=false; localStorage.setItem('modo_auto','false'); render();}}
function voltarAuto(){modoAuto=true; localStorage.setItem('modo_auto','true'); render();}
function novaVenda(){let nome=prompt('Nome?')||'Nome'; dados.push({nome:nome,qtd:1,valor:84,pago:0,fiado:0}); salvar();}
function zerarDia(){if(confirm('Zerar?')){dados.forEach(d=>{d.qtd=0;d.pago=0;d.fiado=0;}); salvar();}}
function fotoZap(){alert('Print sem resumo azul!');}
render();
setInterval(()=>{document.querySelectorAll('div').forEach(el=>{if(el.innerText.includes('RESUMO DO DIA')) el.style.display='none';});},500);
</script>
</body>
</html>
