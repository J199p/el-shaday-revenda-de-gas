<title>BULLEX TIMER PRO - 57s</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
  body{background:#0a0a0a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .logo{width:120px;height:120px;background:#000;border:2px solid #00ff88;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 0 30px rgba(0,255,136,0.3);}
  .logo h1{color:#00ff88;font-size:18px;line-height:18px;text-align:center;}
  .logo span{color:#00ff88;font-size:32px;font-weight:900;}
  .card{background:#111;border:1px solid #222;border-radius:20px;padding:25px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .time{font-size:80px;font-weight:900;color:#fff;letter-spacing:-3px;margin:10px 0;}
  .time.green{color:#00ff88;text-shadow:0 0 20px #00ff88;}
  .label{color:#888;text-transform:uppercase;letter-spacing:3px;font-size:12px;margin-bottom:15px;}
  .signal{height:60px;background:#1a1a1a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin-top:20px;transition:0.3s;border:2px solid #222;}
  .signal.active{background:#00ff88;color:#000;border-color:#00ff88;animation:pulse 0.5s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .progress{width:100%;height:6px;background:#222;border-radius:10px;margin-top:20px;overflow:hidden;}
  .progress-bar{height:100%;background:#00ff88;width:0%;transition:width 1s linear;}
  .info{margin-top:20px;color:#555;font-size:11px;}
  .btn-vibrate{margin-top:15px;background:#222;color:#888;border:none;padding:8px 15px;border-radius:20px;font-size:11px;}
</style>
</head>
