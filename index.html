<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY FIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f7fb;font-family:Arial}
.top{background:#1e3a8a;color:#fff;padding:15px;text-align:center;border-radius:0 0 20px 20px}
.estoque{display:flex;gap:8px;margin:12px}.est{flex:1;background:#fff;border-radius:15px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.est input{width:100%;height:50px;border:2px dashed #16a34a;border-radius:12px;text-align:center;font-size:26px;font-weight:bold;background:#f0fdf4}
.card{background:#fff;margin:12px;border-radius:20px;padding:12px}
table{width:100%;border-spacing:4px}th{padding:14px 2px;border-radius:12px;color:#fff;font-size:12px;text-align:center} td input{width:100%;height:58px;border:2px solid #ddd;border-radius:12px;text-align:center;font-weight:bold;font-size:16px}
.calc{height:58px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:bold;font-size:12px;border:2px solid #ddd;background:#fff}
.c1{background:#facc15;color:#000}.c2{background:#16a34a}.c3{background:#000}.c4{background:#facc15;color:#000}.c5{background:#2563eb}.c6{background:#0f766e}.c7{background:#ea580c}
select.status{width:100%;height:58px;border-radius:12px;border:2px solid #ddd;font-weight:bold;font-size:11px;text-align:center}
.btn{border:none;padding:12px 16px;border-radius:12px;font-weight:bold;color:#fff;background:#16a34a;cursor:pointer}.btn-pdf{background:#fff;color:#0f766e;border:1px solid #ccc}.btn-img{background:#facc15;color:#000}.btn-zerar{background:#ef4444}.btn-sair{background:#000}
.input-top{width:75px;height:32px;border-radius:8px;border:none;text-align:center;font-weight:bold;font-size:16px}
#telaSenha{position:fixed;top:0;left:0;width:100%;height:100%;background:#1e3a8a;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;padding:20px}
</style>
</head>
<body>
<div id="telaSenha"><h1>🔒 EL SHADAY</h1><p>Senha do escritório</p><input type="password" id="inputSenha" placeholder="••••" style="padding:16px;border-radius:12px;border:none;width:220px;text-align:center;font-size:20px;margin:12px;letter-spacing:4px"><button onclick="verificarSenha()" style="padding:14px 40px;border-radius:12px;border:none;background:#16a34a;color:#fff;font-weight:bold;font-size:18px">ENTRAR</button><p id="erroSenha" style="color:#facc15;display:none;margin-top:10px">Senha errada!</p></div>

<div id="areaPrint">
<div class="top"><h1>🔥 EL SHADAY</h1><div style="background:#fff;color:#000;padding:10px;border-radius:12px;margin-top:10px">📅 <input type="date" id="data" style="border:none;font-weight:bold"> - ESTOQUE: <input type="number" id="estoqueInicial" class="input-top" value="200" onchange="salvar()"> - <span id="status">Salvando auto...</span></div></div>
<div class="estoque">
<div class="est" style="border-left:8px solid #16a34a"><small>🔵 CHEIO EDITÁVEL</small><input type="number" id="qCheio" value="200" oninput="manualCheio=true;salvar()"><br><button onclick="manualCheio=false;calcular();salvar();" style="font-size:9px;padding:4px 8px;border:none;background:#16a34a;color:#fff;border-radius:6px;margin-top:4px">Voltar Auto</button></div>
<div class="est" style="border-left:8px solid #ef4444"><small>🔴 VAZIO</small><p id="qVazio" style="font-size:26px;font-weight:bold;margin-top:8px">0</p></div>
<div class="est" style="border-left:8px solid #facc15"><small>📦 VENDIDO</small><p id="qVend" style="font-size:26px;font-weight:bold;margin-top:8px">0</p></div>
</div>
<div class="card"><table><thead><tr><th class="c1">Cliente</th><th class="c2">Qtd</th><th class="c3">Unit</th><th class="c4">Total</th><th class="c5">PIX</th><th class="c6">DH</th><th class="c7">PAG?</th></tr></thead><tbody id="corpo"></tbody></table>
<div id="totGeral" style="margin-top:12px;font-weight:bold">TOTAL: 0</div>
<div id="totAmanha" style="background:#facc15;color:#000;padding:10px;border-radius:12px;margin-top:8px;font-weight:bold">⏰ PRA RECEBER AMANHÃ: R$ 0</div>
<div id="totFiado" style="background:#ef4444;color:#fff;padding:10px;border-radius:12px;margin-top:6px;font-weight:bold">📝 FIADO TOTAL: R$ 0</div>
</div>
</div>

<div style="margin:12px;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-pdf" onclick="gerarPDFBonito()">📄 PDF igual tela</button>
<button class="btn btn-img" onclick="gerarImagem()">🖼️ FOTO Zap</button>
<button class="btn" onclick="novaLinha()">+ Venda</button>
<button class="btn btn-zerar" onclick="zerarDia()">🗑️ ZERAR DIA</button>
<button class="btn btn-sair" onclick="sair()">Sair</button>
</div>

<script>
const CHAVE_FIXA="ELSHADAY_DADOS_FIXOS", SENHA_KEY="ELSHADAY_SENHA";
let manualCheio=false, carregando=true;

function getSenha(){return localStorage.getItem(SENHA_KEY)||"1999";}
function verificarSenha(){let s=document.getElementById('inputSenha').value.trim(); if(s===getSenha()||s==="9999"){if(s==="9999")localStorage.setItem(SENHA_KEY,"1999"); document.getElementById('telaSenha').style.display='none'; localStorage.setItem('logado','1'); carregar();}else{document.getElementById('erroSenha').style.display='block';}}
function sair(){localStorage.removeItem('logado'); location.reload();}

function novaLinha(d){
 let tr=document.createElement('tr');
 tr.innerHTML=`<td><input class="cli" value="${d?d.n||'' :''}" placeholder="Nome"></td><td><input type="number" class="q" value="${d?d.q||'' :''}"></td><td><input type="number" class="vu" value="${d?d.vu||'' :''}"></td><td><div class="calc vt" style="background:#fef3c7">R$ 0</div></td><td><input type="number" class="pix" value="${d?d.pix||'' :''}"></td><td><div class="calc dh" style="background:#d1fae5">R$ 0</div></td><td><select class="status" onchange="mudarCor(this);calcular();salvar();"><option value="PAGO" ${d&&d.st==='PAGO'?'selected':''}>✅ PAGO</option><option value="FIADO" ${d&&d.st==='FIADO'?'selected':''}>📝 FIADO</option><option value="AMANHA" ${d&&d.st==='AMANHA'?'selected':''}>⏰ AMANHÃ</option></select></td>`;
 document.getElementById('corpo').appendChild(tr);
 tr.querySelectorAll('input').forEach(i=>{i.addEventListener('input',()=>{calcular();salvar();}); i.addEventListener('change',()=>{calcular();salvar();});});
 mudarCor(tr.querySelector('.status'));
}
function mudarCor(sel){ if(!sel) return; sel.className='status status-'+sel.value; }

function calcular(){
 let vendido=0,totalGeral=0,totalPIX=0,totalDH=0,totalAmanha=0,totalFiado=0;
 document.querySelectorAll('#corpo tr').forEach(r=>{
  let q=parseFloat(r.querySelector('.q').value)||0, vu=parseFloat(r.querySelector('.vu').value)||0, pix=parseFloat(r.querySelector('.pix').value)||0;
  let st=r.querySelector('.status')?.value||'PAGO';
  let total=q*vu, dh=total-pix; if(dh<0) dh=0;
  r.querySelector('.vt').innerHTML='R$<br>'+total.toFixed(0);
  r.querySelector('.dh').innerText='R$ '+dh.toFixed(0);
  vendido+=q; totalGeral+=total; totalPIX+=pix; totalDH+=dh;
  if(st==='AMANHA') totalAmanha+=dh;
  if(st==='FIADO') totalFiado+=dh;
 });
 let estoque=parseFloat(document.getElementById('estoqueInicial').value)||200;
 if(!manualCheio){ let rest=estoque-vendido; if(rest<0) rest=0; document.getElementById('qCheio').value=rest; }
 document.getElementById('qVend').innerText=vendido;
 document.getElementById('qVazio').innerText=vendido;
 document.getElementById('totGeral').innerText=`TOTAL: ${vendido} bot | FIXO R$ ${totalGeral.toFixed(0)} | PIX R$ ${totalPIX.toFixed(0)} | DH R$ ${totalDH.toFixed(0)} | CHEIO ${document.getElementById('qCheio').value}`;
 document.getElementById('totAmanha').innerText=`⏰ PRA RECEBER AMANHÃ: R$ ${totalAmanha.toFixed(0)}`;
 document.getElementById('totFiado').innerText=`📝 FIADO TOTAL: R$ ${totalFiado.toFixed(0)}`;
}

function salvar(){
 if(carregando) return; // NÃO SALVA ENQUANTO ESTÁ CARREGANDO - ISSO QUE CAUSAVA ZERAR
 let arr=[]; document.querySelectorAll('#corpo tr').forEach(r=>arr.push({n:r.querySelector('.cli').value,q:r.querySelector('.q').value,vu:r.querySelector('.vu').value,pix:r.querySelector('.pix').value,st:r.querySelector('.status')?.value||'PAGO'}));
 let dados={vendas:arr, data:document.getElementById('data').value, estoque:document.getElementById('estoqueInicial').value, cheio:document.getElementById('qCheio').value, manual:manualCheio};
 localStorage.setItem(CHAVE_FIXA, JSON.stringify(dados));
 document.getElementById('status').innerText='Salvo ✓ '+new Date().toLocaleTimeString();
}

function carregar(){
 carregando=true;
 document.getElementById('corpo').innerHTML='';
 let dados=null;
 // 1. TENTA A MEMÓRIA NOVA
 try{ dados=JSON.parse(localStorage.getItem(CHAVE_FIXA)||'null'); }catch(e){}
 // 2. SE NÃO ACHOU, PROCURA NAS MEMÓRIAS ANTIGAS (V13,V14,V15...) PARA RECUPERAR
 if(!dados || !dados.vendas || dados.vendas.length===0){
   const chavesAntigas=["ELSHADAY_FIADO_V13","ELSHADAY_PRINT_V14","ELSHADAY_FINAL_V15","ELSHADAY_FIADO_V13_DATA","backup"];
   for(let k of chavesAntigas){
     try{ let velho=JSON.parse(localStorage.getItem(k)||'[]'); if(Array.isArray(velho) && velho.length>0){ dados={vendas:velho}; break; } }catch(e){}
   }
 }
 if(dados && dados.vendas && dados.vendas.length>0){
   dados.vendas.forEach(v=>novaLinha(v));
   if(dados.data) document.getElementById('data').value=dados.data;
   if(dados.estoque) document.getElementById('estoqueInicial').value=dados.estoque;
   if(dados.cheio) document.getElementById('qCheio').value=dados.cheio;
   manualCheio=!!dados.manual;
 }else{
   for(let i=0;i<9;i++) novaLinha(null);
 }
 if(!document.getElementById('data').value) document.getElementById('data').valueAsDate=new Date();
 calcular();
 carregando=false; // LIBERA PRA SALVAR DE NOVO
 salvar();
}

function zerarDia(){
 if(!confirm("⚠️ ZERAR TUDO pro próximo dia?")) return;
 let senha=prompt("Digite a senha 1999 pra confirmar:");
 if(senha!==getSenha() && senha!=="9999"){ alert("Senha errada!"); return; }
 localStorage.removeItem(CHAVE_FIXA);
 document.getElementById('corpo').innerHTML='';
 for(let i=0;i<10;i++) novaLinha(null);
 document.getElementById('estoqueInicial').value=200;
 document.getElementById('qCheio').value=200;
 manualCheio=false;
 document.getElementById('data').valueAsDate=new Date();
 calcular(); salvar();
 alert("✅ Zerado!");
}

// INICIA - SEMPRE CARREGA, MESMO LOGADO
if(localStorage.getItem('logado')==='1'){ document.getElementById('telaSenha').style.display='none'; }
carregar();

async function gerarPDFBonito(){ const area=document.getElementById('areaPrint'); const canvas=await html2canvas(area,{scale:2,useCORS:true,backgroundColor:'#f5f7fb'}); const imgData=canvas.toDataURL('image/png'); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4'); const pageW=pdf.internal.pageSize.getWidth(); const imgW=pageW-10; const imgH=canvas.height*imgW/canvas.width; pdf.addImage(imgData,'PNG',5,5,imgW,imgH); pdf.save(`EL-SHADAY-${document.getElementById('data').value}.pdf`); }
async function gerarImagem(){ const area=document.getElementById('areaPrint'); const canvas=await html2canvas(area,{scale:2,useCORS:true,backgroundColor:'#f5f7fb'}); const link=document.createElement('a'); link.download=`EL-SHADAY-${document.getElementById('data').value}.png`; link.href=canvas.toDataURL(); link.click(); }

setInterval(()=>{ if(!carregando){calcular();salvar();} },2000);
</script>
</body>
                                                  </html>
