<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY - GÁS E ÁGUA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#eef2f7;padding:10px}
.topo{background:#0d2a6b;color:white;padding:14px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cards{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.card{flex:1;min-width:110px;background:white;padding:10px;border-radius:15px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1);border-left:6px solid}
.card b{font-size:10px;display:block;margin-bottom:4px}
.card input{font-size:26px;font-weight:900;width:100%;border:2px dashed #ccc;border-radius:10px;text-align:center;background:#f9fafb}
.tabela{background:white;border-radius:15px;padding:8px}
.header{display:grid;grid-template-columns:1.3fr 0.7fr 0.5fr 0.5fr 0.7fr 0.5fr 0.5fr;gap:4px;margin-bottom:6px}
.header span{padding:7px;border-radius:8px;font-weight:900;font-size:11px;text-align:center}
.linha{display:grid;grid-template-columns:1.3fr 0.7fr 0.5fr 0.5fr 0.7fr 0.5fr 0.5fr;gap:4px;margin-bottom:5px}
.linha input,.linha select{padding:8px;border:1px solid #ddd;border-radius:8px;text-align:center;font-weight:bold;width:100%;font-size:12px}
.total{background:#fef9c3;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px}
.botoes{display:flex;gap:8px;margin-top:12px}
.botoes button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:900;color:white}
</style>
</head>
<body>

<div class="topo">
  <h1>🔥 EL SHADAY - GÁS E ÁGUA 💧</h1>
  <input type="date" id="data" style="padding:6px 12px;border-radius:20px;border:none;font-weight:bold">
</div>

<div class="cards">
  <div class="card" style="border-color:#00c950"><b>🔥 GÁS CHEIO</b><input type="number" id="gasCheio" value="200" oninput="salvar()"></div>
  <div class="card" style="border-color:#ef4444"><b>🔴 GÁS VAZIO</b><input type="number" id="gasVazio" value="0" oninput="salvar()"></div>
  <div class="card" style="border-color:#facc15"><b>📦 GÁS VENDIDO</b><div style="font-size:26px;font-weight:900" id="gasVendido">0</div></div>
  <div class="card" style="border-color:#0ea5e9"><b>💧 ÁGUA CHEIA</b><input type="number" id="aguaCheia" value="150" oninput="salvar()"></div>
  <div class="card" style="border-color:#0284c7"><b>🔵 ÁGUA VAZIA</b><input type="number" id="aguaVazia" value="0" oninput="salvar()"></div>
  <div class="card" style="border-color:#0ea5e9"><b>💧 ÁGUA VENDIDA</b><div style="font-size:26px;font-weight:900" id="aguaVendida">0</div></div>
</div>

<div class="tabela">
  <div class="header">
    <span style="background:#facc15">Cliente</span>
    <span style="background:#e0e7ff">Produto</span>
    <span style="background:#86efac">Qtd</span>
    <span style="background:#000;color:white">Unit</span>
    <span style="background:#fef08a">Total</span>
    <span style="background:#3b82f6;color:white">PIX</span>
    <span style="background:#16a34a;color:white">DH</span>
  </div>
  <div id="linhas"></div>
  <div id="rodape" style="text-align:center;font-weight:bold;margin-top:10px;font-size:13px"></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
  <div style="background:#2563eb;padding:10px;border-radius:12px;color:white;font-weight:900;display:flex;justify-content:space-between"><span>PIX:</span><span id="totalPix">R$ 0</span></div>
  <div style="background:#16a34a;padding:10px;border-radius:12px;color:white;font-weight:900;display:flex;justify-content:space-between"><span>DH:</span><span id="totalDh">R$ 0</span></div>
  <div style="background:#ea580c;padding:10px;border-radius:12px;color:white;font-weight:900;display:flex;justify-content:space-between"><span>🔥 GÁS:</span><span id="totalGas">R$ 0</span></div>
  <div style="background:#0284c7;padding:10px;border-radius:12px;color:white;font-weight:900;display:flex;justify-content:space-between"><span>💧 ÁGUA:</span><span id="totalAgua">R$ 0</span></div>
</div>
<div style="background:#0d2a6b;margin-top:8px;padding:14px;border-radius:12px;color:white;font-weight:900;display:flex;justify-content:space-between"><span>TOTAL GERAL:</span><span id="totalGeral">R$ 0</span></div>
<div style="background:#dc2626;margin-top:8px;padding:14px;border-radius:12px;color:white;font-weight:900;display:flex;justify-content:space-between"><span>FALTA RECEBER:</span><span id="falta">R$ 0</span></div>

<div class="botoes">
  <button style="background:#16a34a" onclick="addLinha()">+ Venda</button>
  <button style="background:#f97316" onclick="remLinha()">- Linha</button>
  <button style="background:#dc2626" onclick="zerarTudo()">🗑️ ZERAR</button>
  <button style="background:#1e40af" onclick="window.print()">📄 PDF</button>
</div>

<script>
let numLinhas = 8;
let STORAGE_KEY = 'elshaday_gas_agua_v2';

function criarLinhas(dadosSalvos){
  let c=document.getElementById('linhas'); c.innerHTML='';
  for(let i=0;i<numLinhas;i++){
    let d = dadosSalvos && dadosSalvos[i]? dadosSalvos[i] : {cliente:'', prod:'gas', q:0, u:0, p:0, dh:0};
    c.innerHTML+=`
    <div class="linha">
      <input class="c" placeholder="Cliente" value="${d.cliente}" oninput="salvar()">
      <select class="prod" onchange="mudarProduto(this)">
        <option value="gas" ${d.prod=='gas'?'selected':''}>🔥 GÁS</option>
        <option value="agua" ${d.prod=='agua'?'selected':''}>💧 ÁGUA</option>
        <option value="gasRev" ${d.prod=='gasRev'?'selected':''}>🔥 Revenda</option>
      </select>
      <input type="number" class="q" value="${d.q}" oninput="salvar()">
      <input type="number" class="u" value="${d.u}" oninput="salvar()">
      <div class="total">R$ 0</div>
      <input type="number" class="p" value="${d.p}" oninput="salvar()">
      <input type="number" class="d" value="${d.dh}" oninput="salvar()">
    </div>`;
  }
  calcular();
}

function mudarProduto(sel){
  let u=sel.closest('.linha').querySelector('.u');
  if(sel.value==='gas') u.value=115;
  if(sel.value==='gasRev') u.value=95;
  if(sel.value==='agua') u.value=12;
  salvar();
}

function calcular(){
  let vg=0,va=0,pix=0,dh=0,geral=0,tGas=0,tAgua=0;
  document.querySelectorAll('.linha').forEach(l=>{
    let pr=l.querySelector('.prod').value;
    let q=parseFloat(l.querySelector('.q').value)||0;
    let u=parseFloat(l.querySelector('.u').value)||0;
    let p=parseFloat(l.querySelector('.p').value)||0;
    let d=parseFloat(l.querySelector('.d').value)||0;
    let tot=q*u;
    l.querySelector('.total').innerText='R$ '+tot;
    if(pr.includes('gas')){vg+=q; tGas+=tot;} else {va+=q; tAgua+=tot;}
    pix+=p; dh+=d; geral+=tot;
  });
  document.getElementById('gasVendido').innerText=vg;
  document.getElementById('aguaVendida').innerText=va;
  document.getElementById('totalPix').innerText='R$ '+pix;
  document.getElementById('totalDh').innerText='R$ '+dh;
  document.getElementById('totalGas').innerText='R$ '+tGas;
  document.getElementById('totalAgua').innerText='R$ '+tAgua;
  document.getElementById('totalGeral').innerText='R$ '+geral;
  document.getElementById('falta').innerText='R$ '+(geral-(pix+dh));
  let gc=parseInt(document.getElementById('gasCheio').value)||0;
  let ac=parseInt(document.getElementById('aguaCheia').value)||0;
  let data=document.getElementById('data').value;
  if(data){let [a,m,d]=data.split('-'); document.getElementById('rodape').innerText=`Data: ${d}/${m}/${a} | Gás Rest: ${gc-vg} | Água Rest: ${ac-va}`;}
}

function salvar(){
  calcular();
  let dados = {
    gasCheio: document.getElementById('gasCheio').value,
    gasVazio: document.getElementById('gasVazio').value,
    aguaCheia: document.getElementById('aguaCheia').value,
    aguaVazia: document.getElementById('aguaVazia').value,
    data: document.getElementById('data').value,
    linhas: []
  };
  document.querySelectorAll('.linha').forEach(l=>{
    dados.linhas.push({
      cliente: l.querySelector('.c').value,
      prod: l.querySelector('.prod').value,
      q: l.querySelector('.q').value,
      u: l.querySelector('.u').value,
      p: l.querySelector('.p').value,
      dh: l.querySelector('.d').value
    });
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
}

function carregar(){
  let salvo = localStorage.getItem(STORAGE_KEY);
  if(salvo){
    try{
      let d = JSON.parse(salvo);
      document.getElementById('gasCheio').value = d.gasCheio || 200;
      document.getElementById('gasVazio').value = d.gasVazio || 0;
      document.getElementById('aguaCheia').value = d.aguaCheia || 150;
      document.getElementById('aguaVazia').value = d.aguaVazia || 0;
      document.getElementById('data').value = d.data || new Date().toISOString().split('T')[0];
      numLinhas = d.linhas? d.linhas.length : 8;
      criarLinhas(d.linhas);
      return;
    }catch(e){}
  }
  document.getElementById('data').value=new Date().toISOString().split('T')[0];
  criarLinhas();
}

function addLinha(){numLinhas++; criarLinhas(); salvar();}
function remLinha(){if(numLinhas>1){numLinhas--; let d=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(d&&d.linhas) d.linhas.pop(); criarLinhas(d?d.linhas:null); salvar();}}
function zerarTudo(){
  if(confirm('Tem certeza que quer ZERAR TUDO? Isso apaga tudo salvo!')){
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById('gasCheio').value=200;
    document.getElementById('gasVazio').value=0;
    document.getElementById('aguaCheia').value=150;
    document.getElementById('aguaVazia').value=0;
    criarLinhas();
  }
}

carregar();
document.getElementById('data').addEventListener('change', salvar);
</script>
</body>
</html>
