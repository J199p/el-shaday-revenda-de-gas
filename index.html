<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY CONTROLE DE VENDAS</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f7fb;font-family:Arial,sans-serif}
.top{background:#1e3a8a;color:#fff;padding:15px;border-radius:0 0 20px 20px;text-align:center}
.top h1{font-size:19px}
.data-top{background:#fff;padding:10px;border-radius:12px;display:flex;justify-content:center;align-items:center;gap:8px;color:#000;margin:10px 20px 0 20px}
.data-top input{border:none;font-weight:bold;color:#1e3a8a}
.estoque{display:flex;gap:10px;margin:15px}
.est{flex:1;background:#fff;border-radius:15px;padding:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.est.cheio{border-left:5px solid #16a34a}.est.vazio{border-left:5px solid #ef4444}
.est h3{font-size:11px;color:#666}.est p{font-size:22px;font-weight:bold}
.card{background:#fff;margin:0 15px;border-radius:20px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.1);overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:4px}
th{padding:10px 3px;border-radius:10px;color:#fff;font-size:10px}
td input{width:100%;height:42px;border:1px solid #ddd;border-radius:10px;text-align:center}
.calc{background:#eef2ff;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:bold;font-size:10px}
.c-cli{background:#facc15;color:#000}.c-qtd{background:#16a34a}.c-unit{background:#000}.c-total{background:#facc15;color:#000}.c-desp{background:#ef4444}.c-res{background:#0f766e}
.footer{background:#0f766e;margin:15px;border-radius:15px;padding:12px;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:13px}
.btn{background:#16a34a;border:none;color:#fff;padding:10px 14px;border-radius:10px;font-weight:bold}
.btn-est{background:#2563eb;border:none;color:#fff;padding:5px 8px;border-radius:6px;margin:2px;font-size:11px}
.online{font-size:11px;background:#16a34a;color:#fff;padding:4px 8px;border-radius:10px;margin-top:8px;display:inline-block}
</style>
</head>
<body>
<div class="top">
<h1>🔥 EL SHADAY<br>CONTROLE DE VENDAS</h1>
<div class="data-top">📅 Data: <input type="date" id="dataTop"></div>
<div class="online">🟢 AO VIVO - Todo mundo vê junto</div>
</div>

<div class="estoque">
<div class="est cheio"><h3>🔵 CHEIO</h3><p id="qCheio">0</p><button class="btn-est" onclick="altEst('cheio',1)">+1</button><button class="btn-est" onclick="altEst('cheio',-1)">-1</button></div>
<div class="est vazio"><h3>🔴 VAZIO</h3><p id="qVazio">0</p><button class="btn-est" onclick="altEst('vazio',1)">+1</button><button class="btn-est" onclick="altEst('vazio',-1)">-1</button></div>
<div class="est" style="border-left:5px solid #facc15"><h3>📦 TOTAL</h3><p id="qTotal">0</p></div>
</div>

<div class="card">
<table>
<thead><tr>
<th class="c-cli">Cliente</th><th class="c-qtd">Quant</th><th class="c-unit">Unitário</th><th class="c-total">Total</th><th class="c-desp">Despesa</th><th class="c-res">Resumo</th>
</tr></thead>
<tbody id="corpo"></tbody>
</table>
</div>
<div class="footer"><span id="total">TOTAL: 0 • R$ 0,00</span><button class="btn" onclick="novaLinha()">+ Nova Venda</button></div>

<script>
// CONFIGURAÇÃO FIREBASE - BANCO COMPARTILHADO
const firebaseConfig = {
  databaseURL: "https://el-shaday-vendas-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refVendas = db.ref('vendas');
const refEstoque = db.ref('estoque');

let vendasData = [];

function altEst(tipo,qtd){
  let atual = tipo==='cheio'? parseInt(document.getElementById('qCheio').innerText) : parseInt(document.getElementById('qVazio').innerText);
  atual+=qtd; if(atual<0) atual=0;
  refEstoque.child(tipo).set(atual);
}

refEstoque.on('value', snap=>{
  let d=snap.val()||{cheio:0,vazio:0};
  document.getElementById('qCheio').innerText=d.cheio||0;
  document.getElementById('qVazio').innerText=d.vazio||0;
  document.getElementById('qTotal').innerText=(d.cheio||0)+(d.vazio||0);
});

function novaLinha(dados=null, id=null){
  let tr=document.createElement('tr');
  tr.dataset.id=id||Date.now();
  let nome=dados?dados.nome:''; let q=dados?dados.q:''; let vu=dados?dados.vu:''; let des=dados?dados.des:'';
  tr.innerHTML=`<td><input value="${nome}" oninput="salvarTudo()" placeholder="Nome"></td>
  <td><input type="number" value="${q}" class="q" oninput="calc();salvarTudo()" placeholder="0"></td>
  <td><input type="number" value="${vu}" class="vu" oninput="calc();salvarTudo()" placeholder="0"></td>
  <td><div class="calc vt">R$ 0,00</div></td>
  <td><input type="number" value="${des}" class="des" oninput="calc();salvarTudo()" placeholder="0"></td>
  <td><div class="calc rt">R$ 0,00</div></td>`;
  document.getElementById('corpo').appendChild(tr);
  if(!dados) salvarTudo();
}

function calc(){
  let tv=0,tt=0;
  document.querySelectorAll('#corpo tr').forEach(r=>{
    let q=parseFloat(r.querySelector('.q')?.value)||0;
    let vu=parseFloat(r.querySelector('.vu')?.value)||0;
    let d=parseFloat(r.querySelector('.des')?.value)||0;
    let vt=q*vu; let rt=vt-d;
    r.querySelector('.vt').innerText='R$ '+vt.toFixed(2).replace('.',',');
    r.querySelector('.rt').innerText='R$ '+rt.toFixed(2).replace('.',',');
    if(q>0){tv+=q;tt+=rt;}
  });
  document.getElementById('total').innerText=`TOTAL: ${tv} vendas • R$ ${tt.toFixed(2).replace('.',',')}`;
}

function salvarTudo(){
  let arr=[];
  document.querySelectorAll('#corpo tr').forEach(r=>{
    arr.push({id:r.dataset.id, nome:r.querySelectorAll('input')[0].value, q:r.querySelector('.q').value, vu:r.querySelector('.vu').value, des:r.querySelector('.des').value});
  });
  refVendas.set(arr);
  calc();
}

refVendas.on('value', snap=>{
  let dados=snap.val();
  if(!dados) { document.getElementById('corpo').innerHTML=''; for(let i=0;i<10;i++) novaLinha(); return; }
  if(document.activeElement.tagName==='INPUT') return; // não recarrega se alguém digitando
  document.getElementById('corpo').innerHTML='';
  dados.forEach(d=>novaLinha(d,d.id));
  calc();
});

document.getElementById('dataTop').valueAsDate=new Date();
for(let i=0;i<10;i++) novaLinha();
</script>
</body>
</html>
