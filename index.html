<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY CONTROLE DE VENDAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f7fb;font-family:Arial,sans-serif}
.top{background:#1e3a8a;color:#fff;padding:15px;border-radius:0 0 20px 20px;text-align:center}
.data-top{background:#fff;padding:10px;border-radius:12px;color:#000;margin:10px 20px 0 20px}
.estoque{display:flex;gap:8px;margin:12px}
.est{flex:1;background:#fff;border-radius:15px;padding:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.est.cheio{border-left:5px solid #16a34a}.est.vazio{border-left:5px solid #ef4444}.est.vendido{border-left:5px solid #facc15}
.est p{font-size:22px;font-weight:bold}
.card{background:#fff;margin:0 12px;border-radius:20px;padding:10px}
table{width:100%;border-spacing:3px}
th{padding:9px 2px;border-radius:8px;color:#fff;font-size:9px;text-align:center}
td input{width:100%;height:40px;border:1px solid #ddd;border-radius:8px;text-align:center}
.calc{background:#eef2ff;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold;font-size:10px}
.c-cli{background:#facc15;color:#000}.c-qtd{background:#16a34a}.c-unit{background:#000}.c-total{background:#facc15;color:#000}.c-desp{background:#ef4444}.c-res{background:#0f766e}
.footer{background:#0f766e;margin:12px;border-radius:12px;padding:12px;color:#fff;display:flex;justify-content:space-between;font-weight:bold}
.btn{background:#16a34a;border:none;color:#fff;padding:10px 14px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="top">
<h1>🔥 EL SHADAY CONTROLE DE VENDAS</h1>
<div class="data-top">📅 <input type="date" id="dataTop"> - ESTOQUE INICIAL: <b>200</b> CHEIOS</div>
</div>

<div class="estoque">
<div class="est cheio"><small>🔵 CHEIO RESTANTE</small><p id="qCheio">200</p></div>
<div class="est vazio"><small>🔴 VAZIO</small><p id="qVazio">0</p></div>
<div class="est vendido"><small>📦 VENDIDO</small><p id="qVend">0</p></div>
</div>

<div class="card">
<table>
<thead><tr><th class="c-cli">Cliente</th><th class="c-qtd">Quant</th><th class="c-unit">Unit</th><th class="c-total">Total</th><th class="c-desp">Desp</th><th class="c-res">Resumo</th></tr></thead>
<tbody id="corpo"></tbody>
</table>
</div>
<div class="footer"><span id="totalG">TOTAL: 0 • R$ 0,00</span><button class="btn" onclick="add()">+ Venda</button></div>

<script>
const ESTOQUE_INICIAL = 200; // <-- FÓRMULA: AQUI DEFINE 200

function add(d=null){
let tr=document.createElement('tr');
tr.innerHTML=`<td><input value="${d?d.n:''}" oninput="salvar()" placeholder="Nome"></td>
<td><input type="number" value="${d?d.q:''}" class="q" oninput="calcular()" placeholder="0"></td>
<td><input type="number" value="${d?d.vu:''}" class="vu" oninput="calcular()" placeholder="0"></td>
<td><div class="calc vt">R$ 0</div></td>
<td><input type="number" value="${d?d.de:''}" class="de" oninput="calcular()" placeholder="0"></td>
<td><div class="calc rt">R$ 0</div></td>`;
document.getElementById('corpo').appendChild(tr);
}

function calcular(){
let vendido=0, dinheiro=0;
document.querySelectorAll('#corpo tr').forEach(r=>{
let q=parseFloat(r.querySelector('.q')?.value)||0;
let vu=parseFloat(r.querySelector('.vu')?.value)||0;
let de=parseFloat(r.querySelector('.de')?.value)||0;
let vt=q*vu; let rt=vt-de;
r.querySelector('.vt').innerText='R$ '+vt.toFixed(0);
r.querySelector('.rt').innerText='R$ '+rt.toFixed(0);
vendido+=q; dinheiro+=rt;
});
// FÓRMULA AUTOMÁTICA DO ESTOQUE
let cheioRestante = ESTOQUE_INICIAL - vendido;
if(cheioRestante<0) cheioRestante=0;
document.getElementById('qCheio').innerText=cheioRestante;
document.getElementById('qVazio').innerText=vendido;
document.getElementById('qVend').innerText=vendido;
document.getElementById('totalG').innerText=`TOTAL: ${vendido} botijões • R$ ${dinheiro.toFixed(2).replace('.',',')}`;
salvar();
}

function salvar(){
let arr=[];
document.querySelectorAll('#corpo tr').forEach(r=>{
arr.push({n:r.querySelectorAll('input')[0].value, q:r.querySelector('.q').value, vu:r.querySelector('.vu').value, de:r.querySelector('.de').value});
});
localStorage.setItem('elshaday_final',JSON.stringify(arr));
}
function carregar(){
let s=JSON.parse(localStorage.getItem('elshaday_final')||'[]');
if(s.length>0){s.forEach(d=>add(d));}else{for(let i=0;i<8;i++) add();}
calcular();
}
carregar();
document.getElementById('dataTop').valueAsDate=new Date();
</script>
</body>
</html>
