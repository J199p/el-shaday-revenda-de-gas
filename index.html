<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY FINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f7fb;font-family:Arial}
.top{background:#1e3a8a;color:#fff;padding:15px;text-align:center;border-radius:0 0 20px 20px}
.estoque{display:flex;gap:8px;margin:12px}.est{flex:1;background:#fff;border-radius:15px;padding:10px;text-align:center}
.card{background:#fff;margin:12px;border-radius:16px;padding:10px;overflow-x:auto}
table{width:100%;border-spacing:4px}th{padding:10px 2px;border-radius:10px;color:#fff;font-size:11px;text-align:center} td input{width:100%;height:50px;border:2px solid #ddd;border-radius:10px;text-align:center;font-weight:bold}
.calc{height:50px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:bold;font-size:12px;border:2px solid #ddd;background:#fff}
.c1{background:#facc15;color:#000}.c2{background:#16a34a}.c3{background:#000}.c4{background:#facc15;color:#000}.c5{background:#2563eb}.c6{background:#0f766e}.c7{background:#ea580c}
select.status{width:100%;height:50px;border-radius:10px;border:2px solid #ddd;font-weight:bold;font-size:10px}
.btn{border:none;padding:12px 16px;border-radius:12px;font-weight:bold;color:#fff;background:#16a34a;font-size:13px}.btn-img{background:#facc15;color:#000}.btn-zerar{background:#ef4444}
.final{background:#fff;margin:12px;border-radius:16px;padding:12px;border:2px solid #1e3a8a}
</style>
</head>
<body>
<div id="areaPrint">
<div class="top"><h1>🔥 EL SHADAY</h1><div style="background:#fff;color:#000;padding:10px;border-radius:12px;margin-top:10px">📅 <input type="date" id="data"> - ESTOQUE: <input type="number" id="estoqueInicial" value="200" style="width:70px;border-radius:8px;text-align:center;font-weight:bold;border:1px solid #ccc" oninput="salvar()"> - <span id="status">✓</span></div></div>
<div class="estoque">
<div class="est" style="border-left:8px solid #16a34a"><small>🔵 CHEIO</small><input type="number" id="qCheio" value="200" oninput="manualCheio=true;salvar()"></div>
<div class="est" style="border-left:8px solid #ef4444"><small>🔴 VAZIO</small><p id="qVazio" style="font-size:26px;font-weight:bold">0</p></div>
<div class="est" style="border-left:8px solid #facc15"><small>📦 VENDIDO</small><p id="qVend" style="font-size:26px;font-weight:bold">0</p></div>
</div>
<div class="card"><table><thead><tr><th class="c1">Cliente</th><th class="c2">Qtd</th><th class="c3">Unit</th><th class="c4">Total</th><th class="c5">PIX</th><th class="c6">DH</th><th class="c7">PAG?</th></tr></thead><tbody id="corpo"></tbody></table></div>

<!-- AQUI É O FINAL QUE VOCÊ PERGUNTOU -->
<div class="final">
<div id="totGeral" style="font-weight:bold;font-size:14px;margin-bottom:8px">TOTAL: 0 botijas</div>
<div id="totAmanha" style="background:#facc15;padding:10px;border-radius:10px;font-weight:bold;margin-bottom:6px">⏰ PRA RECEBER AMANHÃ: R$ 0</div>
<div id="totFiado" style="background:#ef4444;color:#fff;padding:10px;border-radius:10px;font-weight:bold">📝 FIADO TOTAL: R$ 0</div>
<div id="totResumo" style="margin-top:10px;background:#1e3a8a;color:#fff;padding:10px;border-radius:10px;font-weight:bold">💰 RESUMO DO DIA: R$ 0 recebido</div>
</div>
</div>

<div style="margin:12px;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-img" onclick="gerarImagem()">🖼️ FOTO Zap</button>
<button class="btn" onclick="addLinha()">+ Venda</button>
<button class="btn btn-zerar" onclick="zerarDia()">🗑️ ZERAR DIA</button>
</div>

<script>
const CHAVE="ELSHADAY_SEM_SENHA_FINAL"; let manualCheio=false;
function criarLinhaHTML(d){
 return `<td><input class="cli" value="${d?.n||''}" placeholder="Nome" oninput="salvar()"></td><td><input type="number" class="q" value="${d?.q||''}" oninput="calcular();salvar()"></td><td><input type="number" class="vu" value="${d?.vu||''}" oninput="calcular();salvar()"></td><td><div class="calc vt">R$ 0</div></td><td><input type="number" class="pix" value="${d?.pix||''}" oninput="calcular();salvar()"></td><td><div class="calc dh">R$ 0</div></td><td><select class="status" onchange="calcular();salvar()"><option value="PAGO" ${d?.st==='PAGO'?'selected':''}>✅ PAGO</option><option value="FIADO" ${d?.st==='FIADO'?'selected':''}>📝 FIADO</option><option value="AMANHA" ${d?.st==='AMANHA'?'selected':''}>⏰ AMANHÃ</option></select></td>`;
}
function addLinha(d){
 let tr=document.createElement('tr'); tr.innerHTML=criarLinhaHTML(d); document.getElementById('corpo').appendChild(tr); if(d==null) salvar();
}
function calcular(){
 let v=0,tG=0,tP=0,tD=0,tA=0,tF=0;
 document.querySelectorAll('#corpo tr').forEach(r=>{
  let q=parseFloat(r.querySelector('.q').value)||0, vu=parseFloat(r.querySelector('.vu').value)||0, pix=parseFloat(r.querySelector('.pix').value)||0, st=r.querySelector('.status').value;
  let total=q*vu, dh=total-pix; if(dh<0) dh=0;
  r.querySelector('.vt').innerText='R$ '+total.toFixed(0);
  r.querySelector('.dh').innerText='R$ '+dh.toFixed(0);
  v+=q; tG+=total; tP+=pix; tD+=dh;
  if(st==='AMANHA') tA+=dh; if(st==='FIADO') tF+=dh;
 });
 if(!manualCheio){ let est=parseFloat(document.getElementById('estoqueInicial').value)||200; document.getElementById('qCheio').value=Math.max(0,est-v); }
 document.getElementById('qVend').innerText=v; document.getElementById('qVazio').innerText=v;
 document.getElementById('totGeral').innerText=`TOTAL: ${v} bot | FIXO R$ ${tG} | PIX R$ ${tP} | DH R$ ${tD} | CHEIO ${document.getElementById('qCheio').value}`;
 document.getElementById('totAmanha').innerText=`⏰ PRA RECEBER AMANHÃ: R$ ${tA}`;
 document.getElementById('totFiado').innerText=`📝 FIADO TOTAL: R$ ${tF}`;
 document.getElementById('totResumo').innerText=`💰 RESUMO DO DIA: R$ ${tP} recebido de R$ ${tG} | FALTA R$ ${tD}`;
}
function salvar(){
 calcular();
 let arr=[]; document.querySelectorAll('#corpo tr').forEach(r=>{
  let n=r.querySelector('.cli').value, q=r.querySelector('.q').value, vu=r.querySelector('.vu').value, pix=r.querySelector('.pix').value;
  if(n||q||vu||pix) arr.push({n,q,vu,pix,st:r.querySelector('.status').value});
 });
 localStorage.setItem(CHAVE, JSON.stringify({vendas:arr,data:document.getElementById('data').value,estoque:document.getElementById('estoqueInicial').value,cheio:document.getElementById('qCheio').value,manual:manualCheio}));
 document.getElementById('status').innerText='Salvo ✓';
}
function carregar(){
 let d=null; try{d=JSON.parse(localStorage.getItem(CHAVE)||'null');}catch(e){}
 let tbody=document.getElementById('corpo'); tbody.innerHTML='';
 if(d && d.vendas && d.vendas.length>0){
   d.vendas.forEach(v=>addLinha(v));
   if(d.data) document.getElementById('data').value=d.data;
   if(d.estoque) document.getElementById('estoqueInicial').value=d.estoque;
   if(d.cheio) document.getElementById('qCheio').value=d.cheio;
   manualCheio=!!d.manual;
 }else{
   for(let i=0;i<10;i++) addLinha(null);
 }
 while(tbody.children.length<10) addLinha(null);
 if(!document.getElementById('data').value) document.getElementById('data').valueAsDate=new Date();
 calcular();
}
function zerarDia(){ if(confirm("Zerar o dia?")){localStorage.removeItem(CHAVE); location.reload();} }
async function gerarImagem(){ const area=document.getElementById('areaPrint'); const canvas=await html2canvas(area,{scale:2,backgroundColor:'#f5f7fb'}); const a=document.createElement('a'); a.download=`EL-SHADAY.png`; a.href=canvas.toDataURL(); a.click(); }
carregar();
</script>
</body>
</html>
