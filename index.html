<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY</title>
</head>
<body style="margin:0;background:#f5f7fb;font-family:Arial">

<div id="login" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1e3a8a;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999">
<h1 style="color:#fff">🔒 EL SHADAY</h1>
<p style="color:#fff">Senha: 1999</p>
<input id="senha" type="tel" placeholder="1999" style="padding:20px;border-radius:15px;border:none;width:200px;text-align:center;font-size:24px;margin:15px">
<button onclick="logar()" style="padding:15px 40px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:18px">ENTRAR</button>
<p style="color:#fff;font-size:12px;margin-top:10px">Se travar, clica 2 vezes rápido</p>
</div>

<div style="background:#1e3a8a;color:#fff;padding:15px;text-align:center">
<h1>🔥 EL SHADAY - ABRIU!</h1>
<p>Se você tá vendo isso, a senha funcionou!</p>
</div>

<div style="padding:15px">
<table border="1" width="100%" style="background:#fff;border-collapse:collapse">
<tr><th>Cliente</th><th>Qtd</th><th>PIX</th></tr>
<tr><td><input style="width:100%;height:40px"></td><td><input style="width:100%;height:40px"></td><td><input style="width:100%;height:40px"></td></tr>
</table>
<p style="margin-top:20px">Agora que abriu, me fala que eu te mando o código completo com estoque, fiado, amanhã e botão zerar.</p>
<button onclick="localStorage.clear();location.reload()" style="margin-top:20px;padding:10px;background:red;color:#fff;border:none;border-radius:8px">SAIR / LIMPAR</button>
</div>

<script>
function logar(){
  var s = document.getElementById('senha').value;
  s = s.replace(/\s/g,'');
  if(s == '1999' || s == '9999'){
    document.getElementById('login').style.display = 'none';
    localStorage.setItem('logado','1');
    alert('ABRIU! Senha certa!');
  } else {
    alert('Senha errada. Digita 1999. Você digitou: ' + s);
  }
}
// se já logou antes
if(localStorage.getItem('logado')=='1'){
  document.getElementById('login').style.display='none';
}
</script>
</body>
</html>
