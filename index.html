<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALYSSON GÁS E ÁGUA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#eef2f7;padding:10px}
.topo{background:#0d2a6b;color:#fff;padding:15px;border-radius:15px;text-align:center}
.topo h1{font-size:22px}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.card{flex:1;min-width:100px;background:#fff;padding:8px;border-radius:12px;text-align:center;border-left:6px solid}
.card b{font-size:10px;display:block}
.card input{width:100%;font-size:24px;font-weight:900;text-align:center;border:2px dashed #ccc;border-radius:8px}
.card div{font-size:24px;font-weight:900}
.tabela{background:#fff;border-radius:12px;padding:8px;overflow-x:auto}
.linha{display:flex;gap:4px;margin-bottom:4px}
.linha input,.linha select,.linha div{flex:1;padding:7px;border:1px solid #ddd;border-radius:7px;text-align:center;font-weight:bold;font-size:12px;min-width:0}
.header{display:flex;gap:4px;margin-bottom:6px;font-weight:900;font-size:10px;text-align:center}
.header span{flex:1;padding:6px;border-radius:7px}
.total{background:#fef9c3;display:flex;align-items:center;justify-content:center}
.resumo{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{padding:12px;border-radius:12px;color:#fff;font-weight:900;display:flex;justify-content:space-between}
.full{grid-column:span 2;padding:14px;border-radius:12px;color:#fff;font-weight:900;display:flex;justify-content:space-between}
.botoes{display:flex;gap:8px;margin-top:10px}
.botoes button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:900;color:#fff}
</style>
</head>
<body>

<div class="topo">
<h1>🔥 ALYSSON GÁS E ÁGUA 💧</h1>
<input type="date" id="data" style="margin-top:6px;border-radius:20px;padding:5px 10px;border:none;font-weight:bold">
</div>

<div class="cards">
<div class="card" style="border-color:green"><b>🔥 GÁS CHEIO</b><input id="gasCheio" type="number" value="200"></div>
<div class="card" style="border-color:red"><b>🔴 GÁS VAZIO</b><div id="gasVazio">0</div></div>
<div class="card" style="border-color:gold"><b>📦 VENDIDO</b><div id="gasVendido">0</div></div>
<div class="card" style="border-color:blue"><b>💧 ÁGUA CHEIA</b><input id="aguaCheia" type="number" value="150"></div>
<div class="card" style="border-color:blue"><b>🔵 ÁGUA VAZIA</b><div id="aguaVazia">0</div></div>
<div class="card" style="border-color:blue"><b>💧 VENDIDA</b><div id="aguaVendida">0</div></div>
</div>

<div class="tabela">
<div class="header">
<span style="background:#facc15">Cliente</span>
<span style="background:#dbeafe">Prod</span>
<span style="background:#86efac">Qtd</span>
<span style="background:#000;color:#fff">Unit</span>
<span style="background:#fef08a">Total</span>
<span style="background:#3b82f6;color:#fff">PIX</span>
<span style="background:#16a34a;color:#fff">DH</span>
</div>
<div id="lista"></div>
<div id="rodape" style="text-align:center;font-weight:bold;margin-top:8px;font-size:12px"></div>
</div>

<div id="dataTopo" style="text-align:center;font-weight:bold;margin-top:8px"></div>
<div class="resumo">
<div class="box" style="background:#2563eb"><span>PIX:</span><span id="tPix">R$ 0</span></div>
<div class="box" style="background:#16a34a"><span>DH:</span><span id="tDh">R$ 0</span></div>
<div class="full" style="background:#1e3a8a"><span>TOTAL GERAL:</span><span id="tGeral">R$ 0</span></div>
<div class="full" style="background:#dc2626"><span>FALTA RECEBER:</span><span id="tFalta">R$ 0</span></div>
</div>

<div class="botoes">
<button style="background:#16a34a" onclick="add()">+ Venda</button>
<button style="background:#f97316" onclick="rem()">- Folha</button>
<button style="background:#dc2626" onclick="zerar()">ZERAR</button>
<button style="background:#1e40af" onclick="print()">PDF</button>
</div>

<script>
const KEY='alysson_limpo_v1';
function linhaHTML(d={}){
return `<div class="linha">
<input class="cli" placeholder="Cliente" value="${d.cli||''}">
<select class="prod"><option value="gas" ${d.prod=='gas'?'selected':''}>🔥 GÁS</option><option value="agua" ${d.prod=='agua'?'selected':''}>💧 ÁGUA</option></select>
<input class="qtd" type="number" value="${d.qtd||0}">
<input class="unit" type="number" value="${d.unit||0}">
<div class="total">R$ 0</div>
<input class="pix" type="number" value="${d.pix||0}">
<input class="dh" type="number" value="${d.dh||0}">
</div>`;
}
function calc(){
let vg=0,va=0,pix=0,dh=0,geral=0;
document.querySelectorAll('.linha').forEach(l=>{
let prod=l.querySelector('.prod').value;
let q=Number(l.querySelector('.qtd').value)||0;
let u=Number(l.querySelector('.unit').value)||0;
let p=Number(l.querySelector('.pix').value)||0;
let d=Number(l.querySelector('.dh').value)||0;
let tot=q*u;
l.querySelector('.total').innerText='R$ '+tot;
if(prod=='gas') vg+=q; else va+=q;
pix+=p; dh+=d; geral+=tot;
});
document.getElementById('gasVazio').innerText=vg;
document.getElementById('aguaVazia').innerText=va;
document.getElementById('gasVendido').innerText=vg;
document.getElementById('aguaVendida').innerText=va;
document.getElementById('tPix').innerText='R$ '+pix;
document.getElementById('tDh').innerText='R$ '+dh;
document.getElementById('tGeral').innerText='R$ '+geral;
document.getElementById('tFalta').innerText='R$ '+(geral-(pix+dh));
let gc=Number(document.getElementById('gasCheio').value)||0;
let ac=Number(document.getElementById('aguaCheia').value)||0;
document.getElementById('rodape').innerText=`Gás Rest: ${gc-vg} | Água Rest: ${ac-va}`;
let dt=document.getElementById('data').value;
if(dt){let [a,m,d]=dt.split('-'); document.getElementById('dataTopo').innerText=`Data: ${d}/${m}/${a}`;}
save();
}
function save(){
let dados={gasCheio:gasCheio.value,aguaCheia:aguaCheia.value,data:data.value,linhas:[]};
document.querySelectorAll('.linha').forEach(l=>{
dados.linhas.push({cli:l.querySelector('.cli').value,prod:l.querySelector('.prod').value,qtd:l.querySelector('.qtd').value,unit:l.querySelector('.unit').value,pix:l.querySelector('.pix').value,dh:l.querySelector('.dh').value});
});
localStorage.setItem(KEY,JSON.stringify(dados));
}
function load(){
let s=localStorage.getItem(KEY);
let lista=document.getElementById('lista');
if(s){
let d=JSON.parse(s);
gasCheio.value=d.gasCheio||200;
aguaCheia.value=d.aguaCheia||150;
data.value=d.data||new Date().toISOString().split('T')[0];
lista.innerHTML='';
d.linhas.forEach(x=>lista.innerHTML+=linhaHTML(x));
}else{
data.value=new Date().toISOString().split('T')[0];
lista.innerHTML='';
for(let i=0;i<8;i++) lista.innerHTML+=linhaHTML();
}
calc();
document.addEventListener('input',calc);
document.addEventListener('change',calc);
}
function add(){document.getElementById('lista').innerHTML+=linhaHTML(); calc();}
function rem(){let ls=document.querySelectorAll('.linha'); if(ls.length>1) ls[ls.length-1].remove(); calc();}
function zerar(){if(confirm('Zerar tudo?')){localStorage.removeItem(KEY); location.reload();}}
load();
</script>
</body>
</html>
