<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY - 200 GÁS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#eef2f7]">
<div class="bg-[#1e3a8a] rounded-b-[24px] p-3 text-center">
  <h1 class="text-white font-black text-[22px]">🔥 EL SHADAY - 200 GÁS</h1>
  <div class="bg-white rounded-xl p-2 mt-2 font-bold text-[11px]">ESTOQUE: <span id="estIni">200</span> - Restantes: <span id="restTop">200</span></div>
</div>

<div class="grid grid-cols-3 gap-2 p-2">
  <div onclick="editarEstoque()" class="bg-white rounded-2xl p-2 text-center shadow border-l-[6px] border-green-500 cursor-pointer">
    <div class="text-[9px] font-bold">🔵 CHEIO EDITÁVEL</div>
    <div id="restanteCheio" class="text-[28px] font-black border-2 border-dashed border-green-500 rounded-xl bg-green-50">200</div>
  </div>
  <div class="bg-white rounded-2xl p-2 text-center shadow border-l-[6px] border-red-500">
    <div class="text-[9px] font-bold">🔴 VAZIO</div><div id="vazio" class="text-[28px] font-black">0</div>
  </div>
  <div class="bg-white rounded-2xl p-2 text-center shadow border-l-[6px] border-yellow-400">
    <div class="text-[9px] font-bold">📦 VENDIDO</div><div id="vendido" class="text-[28px] font-black">0</div>
  </div>
</div>

<div class="bg-white m-2 rounded-2xl p-2 shadow">
  <div class="grid grid-cols-6 gap-1 mb-2 text-white text-[8px] font-black">
    <div class="bg-yellow-400 text-black rounded-lg p-2 text-center">Cliente</div>
    <div class="bg-green-600 rounded-lg p-2 text-center">Quant</div>
    <div class="bg-black rounded-lg p-2 text-center">Unit</div>
    <div class="bg-yellow-200 text-black rounded-lg p-2 text-center">Total</div>
    <div class="bg-blue-600 rounded-lg p-2 text-center">PIX</div>
    <div class="bg-green-700 rounded-lg p-2 text-center">DH</div>
  </div>
  <div id="linhas"></div>

  <!-- 4 CAMPOS QUE VOCÊ PEDIU NO ÁUDIO -->
  <div class="mt-4 space-y-2">
    <div class="bg-blue-600 text-white rounded-xl p-3 font-black text-[13px] flex justify-between">
      <span>💰 RECEBIMENTO NO PIX:</span><span>R$ <span id="totalPix">0</span></span>
    </div>
    <div class="bg-green-600 text-white rounded-xl p-3 font-black text-[13px] flex justify-between">
      <span>💵 RECEBIMENTO EM DINHEIRO:</span><span>R$ <span id="totalDH">0</span></span>
    </div>
    <div class="bg-[#1e3a8a] text-white rounded-xl p-3 font-black text-[13px] flex justify-between">
      <span>📦 TOTAL GERAL:</span><span>R$ <span id="totalGeral">0</span></span>
    </div>
    <div class="bg-red-600 text-white rounded-xl p-3 font-black text-[14px] flex justify-between border-2 border-black">
      <span>⚠️ FALTA RECEBER:</span><span>R$ <span id="faltaReceber">0</span></span>
    </div>
  </div>
</div>

<div class="grid grid-cols-3 gap-2 p-2">
  <button onclick="addLinha()" class="bg-green-600 text-white p-3 rounded-xl font-bold text-[12px]">+ Venda</button>
  <button onclick="zerarTudo()" class="bg-red-600 text-white p-3 rounded-xl font-bold text-[12px]">🗑️ ZERAR TUDO</button>
  <button onclick="window.print()" class="bg-blue-800 text-white p-3 rounded-xl font-bold text-[12px]">📄 PDF</button>
</div>

<script>
let estoque = 200;
let dados = [
 {c:'Paulo',q:0,u:0,pix:0,dh:0},
 {c:'Wellin',q:0,u:0,pix:0,dh:0},
 {c:'Beto',q:0,u:0,pix:0,dh:0},
 {c:'Neto',q:0,u:0,pix:0,dh:0},
];

function render(){
 let html='', sQ=0, sTotal=0, sPix=0, sDH=0;
 dados.forEach((d,i)=>{
  let tot=d.q*d.u;
  sQ+=d.q; sTotal+=tot; sPix+=d.pix; sDH+=d.dh;
  html+=`<div class="grid grid-cols-6 gap-1 mb-1">
   <input class="border rounded-lg p-1 text-center font-bold text-[11px]" value="${d.c}" onchange="dados[${i}].c=this.value">
   <input class="border rounded-lg p-1 text-center font-bold" type="number" value="${d.q}" onchange="dados[${i}].q=parseInt(this.value)||0; render()">
   <input class="border rounded-lg p-1 text-center font-bold" type="number" value="${d.u}" onchange="dados[${i}].u=parseInt(this.value)||0; render()">
   <div class="bg-yellow-100 rounded-lg p-1 text-center font-bold text-[10px]">R$ ${tot}</div>
   <input class="border-2 border-blue-500 bg-blue-50 rounded-lg p-1 text-center font-bold text-blue-700" type="number" value="${d.pix}" onchange="dados[${i}].pix=parseInt(this.value)||0; render()">
   <input class="border-2 border-green-500 bg-green-50 rounded-lg p-1 text-center font-bold" type="number" value="${d.dh}" onchange="dados[${i}].dh=parseInt(this.value)||0; render()">
  </div>`;
 });
 document.getElementById('linhas').innerHTML=html;
 document.getElementById('restanteCheio').innerText=estoque-sQ;
 document.getElementById('restTop').innerText=estoque-sQ;
 document.getElementById('estIni').innerText=estoque;
 document.getElementById('vazio').innerText=sQ;
 document.getElementById('vendido').innerText=sQ;
 document.getElementById('totalPix').innerText=sPix;
 document.getElementById('totalDH').innerText=sDH;
 document.getElementById('totalGeral').innerText=sTotal;
 document.getElementById('faltaReceber').innerText=sTotal-(sPix+sDH);
}
function editarEstoque(){let n=prompt('Quantos CHEIOS?',estoque); if(n){estoque=parseInt(n); render();}}
function zerarTudo(){if(confirm('Zerar tudo?')){estoque=200; dados.forEach(d=>{d.q=0; d.u=0; d.pix=0; d.dh=0;}); render();}}
function addLinha(){dados.push({c:'Nome',q:0,u:0,pix:0,dh:0}); render();}
render();
</script>
</body>
</html>
