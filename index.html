<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EL SHADAY</title></head>
<body style="margin:0;background:#f5f7fb;font-family:Arial">
<div id="senhaTela" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1e3a8a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999">
<h1 style="color:#fff">🔒 EL SHADAY</h1>
<p style="color:#fff">Senha 1999</p>
<input id="s" type="tel" value="1999" style="padding:15px;border-radius:12px;border:none;width:200px;text-align:center;font-size:22px">
<br><br>
<button onclick="document.getElementById('senhaTela').style.display='none';localStorage.setItem('logado','1')" style="padding:18px 60px;background:#16a34a;color:#fff;border:none;border-radius:14px;font-weight:bold;font-size:20px">ENTRAR</button>
<br><br>
<button onclick="document.getElementById('senhaTela').style.display='none'" style="padding:12px 20px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:bold">FORÇAR ENTRADA (sem senha)</button>
</div>

<div style="background:#1e3a8a;color:#fff;padding:15px;text-align:center">
<h2>🔥 EL SHADAY - FUNCIONOU!</h2>
<p>Estoque cheio editável - não zera mais</p>
Data: <input type="date" id="data"> Estoque: <input type="number" id="est" value="200" style="width:60px">
</div>

<div style="padding:10px">
<table border="1" width="100%" style="background:#fff;border-collapse:collapse"><tr><th>Cliente</th><th>Qtd</th><th>Unit</th><th>Total</th><th>PIX</th><th>DH</th><th>PAG</th></tr>
<tr><td><input style="width:100%;height:40px"></td><td><input type="number" class="q" oninput="calc()" style="width:100%;height:40px"></td><td><input type="number" class="v" value="120" oninput="calc()" style="width:100%;height:40px"></td><td><div id="tot" style="text-align:center;font-weight:bold">R$ 0</div></td><td><input type="number" style="width:100%;height:40px"></td><td><div style="text-align:center">R$ 0</div></td><td><select style="width:100%;height:40px"><option>PAGO</option><option>FIADO</option><option>AMANHÃ</option></select></td></tr>
</table>
<p id="res" style="margin-top:10px;font-weight:bold;background:#fff;padding:10px;border-radius:10px"></p>
<button onclick="if(prompt('Senha pra zerar:')=='1999'){localStorage.clear();location.reload()}" style="margin-top:15px;padding:12px;background:red;color:#fff;border:none;border-radius:8px;font-weight:bold">🗑️ ZERAR DIA (senha 1999)</button>
</div>

<script>
function calc(){let q=document.querySelector('.q').value||0; let v=document.querySelector('.v').value||0; let t=q*v; document.getElementById('tot').innerText='R$ '+t; document.getElementById('res').innerText='Vendido: '+q+' | Cheio restante: '+(200-q)}
if(localStorage.getItem('logado')=='1'){document.getElementById('senhaTela').style.display='none';}
document.getElementById('data').valueAsDate=new Date();
</script>
</body>
</html>
